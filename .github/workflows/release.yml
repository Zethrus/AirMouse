name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux package
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo systemctl stop unattended-upgrades.service || true
          sudo systemctl disable --now unattended-upgrades.service || true
          for lock in /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock; do
            while sudo fuser "$lock" >/dev/null 2>&1; do
              echo "waiting for $lock"
              sleep 3
            done
          done
          sudo apt-get -o Acquire::Retries=5 -o DPkg::Lock::Timeout=120 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libx11-dev libxtst-dev libxext-dev libxrender-dev libxfixes-dev \
            libcairo2-dev libpango1.0-dev libdbus-1-dev \
            libegl-dev libgles-dev libjpeg-dev \
            dpkg-dev rpm
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAIRMOUSE_VERSION=${{ needs.meta.outputs.version }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cpack -B "$PWD/dist" --config build/CPackConfig.cmake
          ls -lh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airmouse-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows package
    needs: meta
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install WiX and NSIS
        shell: pwsh
        run: |
          choco install wixtoolset nsis --yes --no-progress
          $wix = Get-ChildItem -Path "C:\Program Files*","C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { Add-Content $env:GITHUB_PATH (Join-Path $wix.FullName "bin") }
          if (Test-Path "C:\Program Files (x86)\NSIS") { Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS" }
          if (Test-Path "C:\Program Files\NSIS") { Add-Content $env:GITHUB_PATH "C:\Program Files\NSIS" }
      - name: Fetch MediaPipe
        shell: bash
        run: python scripts/fetch_mediapipe.py
      - name: Generate import library
        shell: bash
        run: python scripts/gen_msvc_implib.py third_party/mediapipe/lib/libmediapipe.dll
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DAIRMOUSE_FETCH_MEDIAPIPE=OFF
          -DAIRMOUSE_VERSION=${{ needs.meta.outputs.version }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package ZIP
        run: cpack -C Release -B "$PWD/dist" --config build/CPackConfig.cmake -G ZIP
      - name: Package MSI
        run: cpack -C Release -B "$PWD/dist" --config build/CPackConfig.cmake -G WIX
      - name: Package EXE installer
        run: cpack -C Release -B "$PWD/dist" --config build/CPackConfig.cmake -G NSIS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airmouse-windows
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.exe
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [meta, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f -ls
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.msi
            artifacts/*.exe
          fail_on_unmatched_files: true
